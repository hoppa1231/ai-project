# Public desktop releases, independent of backend authentication.
location ^~ /updates/desktop/ {
    alias /var/www/chspch-updates/desktop/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    types { application/json json; text/html html; application/zip zip; application/gzip gz; }
    default_type application/octet-stream;
    limit_except GET HEAD { deny all; }
}
