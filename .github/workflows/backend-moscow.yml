name: Backend CI/CD Moscow

on:
  push:
    branches:
      - product
    paths:
      - "backend/**"
      - ".github/workflows/backend-moscow.yml"
  workflow_dispatch:

concurrency:
  group: backend-moscow
  cancel-in-progress: true

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build

  deploy-moscow:
    name: Deploy to Moscow
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/product' || github.event_name == 'workflow_dispatch'
    environment: moscow
    env:
      SSH_HOST: ${{ secrets.MOSCOW_SSH_HOST }}
      SSH_USER: ${{ secrets.MOSCOW_SSH_USER }}
      SSH_PORT: ${{ secrets.MOSCOW_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.MOSCOW_DEPLOY_PATH || '/opt/vpn-control-plane' }}
      COMPOSE_PROJECT_NAME: vpn-control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -t "${COMPOSE_PROJECT_NAME}_backend:latest" backend

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.MOSCOW_SSH_PRIVATE_KEY }}" > ~/.ssh/moscow
          chmod 600 ~/.ssh/moscow
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload backend sources
        run: |
          DEPLOY_ROOT="${DEPLOY_PATH%/backend}"
          tar \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='.env' \
            -C backend \
            -czf - . \
          | ssh -T -i ~/.ssh/moscow -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "mkdir -p '$DEPLOY_ROOT' && tar -xzf - -C '$DEPLOY_ROOT'"

      - name: Upload backend image
        run: |
          docker save "${COMPOSE_PROJECT_NAME}_backend:latest" \
          | gzip -1 \
          | ssh -T -i ~/.ssh/moscow -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "gunzip | docker load"

      - name: Restart backend
        run: |
          DEPLOY_ROOT="${DEPLOY_PATH%/backend}"
          ssh -T -i ~/.ssh/moscow -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_ROOT='$DEPLOY_ROOT' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_ROOT"
          test -f .env
          if docker compose version >/dev/null 2>&1; then
            compose="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            compose="docker-compose"
          else
            echo "Docker Compose is not installed. Install docker-compose-plugin or docker-compose." >&2
            exit 1
          fi
          $compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml up -d --no-build --remove-orphans
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Backend health check did not pass in time" >&2
              exit 1
            fi
            sleep 2
          done
          docker image prune -f
          EOF
