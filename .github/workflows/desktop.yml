name: Chspch Desktop
on:
  workflow_dispatch:
  push:
    paths: ['desktop-client/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop-client/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-client
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Helper tests
        working-directory: desktop-client/helper
        run: go test ./...
      - name: Fetch verified VPN core
        run: python scripts/fetch-core.py '${{ matrix.target }}'
      - name: Tests and portable application image
        run: bash ./gradlew test createDistributable --console=plain
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          if ! bash ./gradlew packageMsi --console=plain; then
            find build/compose/logs/packageMsi -type f -name '*.txt' -print -exec cat {} +
            exit 1
          fi
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chspch-diagnostics-${{ matrix.target }}
          path: |
            desktop-client/build/test-results/
            desktop-client/build/reports/tests/
            desktop-client/build/compose/logs/
            desktop-client/build/compose/tmp/*.args.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: chspch-${{ matrix.target }}
          path: |
            desktop-client/build/compose/binaries/main/app/
            desktop-client/build/compose/binaries/main/msi/
          if-no-files-found: error
