[versions]
kotlin = "2.3.20"
ktor = "3.4.0"
logback = "1.5.20"
exposed = "1.1.1"
postgresql = "42.7.8"
hikaricp = "7.0.1"

h2 = "2.4.240"


[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
ktor-server-config-yaml = { module = "io.ktor:ktor-server-config-yaml", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
# Полные зависимости для Exposed'а
# Основное расширение - базовые компоненты абстракции
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
# Транспортный модуль
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
# Высокоуровневые абстракции - работа с отношениями, как с классами
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
# Работа с датой и временем на основе API времени Java 8
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
# Расширение типов данных JSOB и JSONB
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
# Шифрование данных
exposed-crypt = { module = "org.jetbrains.exposed:exposed-crypt", version.ref = "exposed" }
# Миграция
exposed-migration-jdbc = { module = "org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }
# БДшка
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }

# Временная таблица для тестов
h2 = { module = "com.h2database:h2", version.ref = "h2" }


[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }